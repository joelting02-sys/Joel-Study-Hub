name: Release Windows (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.1; leave empty to use v<package.json version>)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release-windows:
    name: Build & Publish Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve release tag and version
        id: tag
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw -Path package.json | ConvertFrom-Json
          $defaultTag = "v$($pkg.version)"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.release_tag }}".Trim() -ne "") {
            $tagName = "${{ inputs.release_tag }}".Trim()
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tagName = "${{ github.ref_name }}"
          } else {
            $tagName = $defaultTag
          }
          $cleanVersion = $tagName -replace '^[vV]', ''
          if ($cleanVersion -notmatch '^\d+\.\d+\.\d+') {
            $cleanVersion = $pkg.version
          }
          Write-Host "Release tag: $tagName | App version: $cleanVersion"
          echo "name=$tagName" >> $env:GITHUB_OUTPUT
          echo "version=$cleanVersion" >> $env:GITHUB_OUTPUT

      - name: Inject GitHub Releases auto-update publish config into package.json
        shell: pwsh
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.tag.outputs.version }}';
            pkg.build = pkg.build || {};
            pkg.build.generateUpdatesFilesForAllChannels = true;
            pkg.build.publish = [
              {
                provider: 'github',
                owner: '${{ github.repository_owner }}',
                repo: '${{ github.event.repository.name }}',
                releaseType: 'release'
              }
            ];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: npm install

      - name: Build Electron main process
        run: npm run electron:build-main

      - name: Type-check & run tests
        run: |
          npm run lint
          npm test

      - name: Install Electron & electron-builder
        run: npm install --no-save electron electron-builder

      - name: Build Windows installer, portable .exe & auto-update metadata (latest.yml + blockmap + app-update.yml)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npm run electron:build-main
          npx electron-builder --win nsis portable --publish never

      - name: Verify .exe, blockmap, latest.yml and app-update.yml artifacts exist
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path release -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $exes -or $exes.Count -eq 0) {
            Write-Error "No .exe files found in release/ directory!"
            exit 1
          }
          if (-not (Test-Path "release/latest.yml")) {
            Write-Error "release/latest.yml was not generated! Auto-update requires latest.yml."
            exit 1
          }
          if (-not (Test-Path "release/win-unpacked/resources/app-update.yml")) {
            Write-Error "release/win-unpacked/resources/app-update.yml was not generated! In-app updater requires app-update.yml."
            exit 1
          }
          Write-Host "=== release/latest.yml ==="
          Get-Content "release/latest.yml"
          Write-Host "=== resources/app-update.yml ==="
          Get-Content "release/win-unpacked/resources/app-update.yml"
          Get-ChildItem -Path release | Format-Table Name, Length

      - name: Upload Windows .exe workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StudyHub-Windows-x64
          path: |
            release/StudyHub-Setup-*.exe
            release/StudyHub-Setup-*.exe.blockmap
            release/StudyHub-Portable-*.exe
            release/latest.yml
            AGENT_GUIDE.md

      - name: Publish Release notes & ensure all auto-update assets are attached
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Joel Study Hub ${{ steps.tag.outputs.name }} (Windows x64)
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Joel Study Hub Windows 桌面客户端 (${{ steps.tag.outputs.name }})

            纯原生 Electron 客户端（**零 localhost、零端口、零预设示例**），支持应用内通过 GitHub Releases 一键检查并升级。

            ### 下载说明（点击下方 Assets 中的文件下载）
            - **`StudyHub-Setup-*.exe`**（推荐）：标准 Windows 安装程序，支持应用内「设置 → 检查更新」一键自动升级。
            - **`StudyHub-Portable-*.exe`**：免安装便携版，下载后双击即可运行。
            - **`latest.yml` & `*.blockmap`**：官方 `electron-updater` 自动更新校验与增量更新元数据文件（请勿删除）。
            - **`AGENT_GUIDE.md`**：AI Agent 接入协议文档。
          files: |
            release/StudyHub-Setup-*.exe
            release/StudyHub-Setup-*.exe.blockmap
            release/StudyHub-Portable-*.exe
            release/latest.yml
            AGENT_GUIDE.md
