name: Release Windows (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.2; leave empty to use v<package.json version>)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release-windows:
    name: Build & Publish Windows Tauri v2 (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Resolve release tag and version
        id: tag
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw -Path package.json | ConvertFrom-Json
          $defaultTag = "v$($pkg.version)"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.release_tag }}".Trim() -ne "") {
            $tagName = "${{ inputs.release_tag }}".Trim()
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tagName = "${{ github.ref_name }}"
          } else {
            $tagName = $defaultTag
          }
          $cleanVersion = $tagName -replace '^[vV]', ''
          if ($cleanVersion -notmatch '^\d+\.\d+\.\d+') {
            $cleanVersion = $pkg.version
          }
          Write-Host "Release tag: $tagName | App version: $cleanVersion"
          echo "name=$tagName" >> $env:GITHUB_OUTPUT
          echo "version=$cleanVersion" >> $env:GITHUB_OUTPUT

      - name: Sync version across package.json, tauri.conf.json and Cargo.toml
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"
          node -e "
            const fs = require('fs');
            const ver = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = ver;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauriConf.version = ver;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2) + '\n');

            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version\s*=\s*\"[^\"]+\"/m, 'version = \"' + ver + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          " $ver

      - name: Install frontend dependencies
        run: npm install

      - name: Type-check, run frontend tests & build dist
        run: |
          npm run lint
          npm test
          npm run build

      - name: Run Rust unit & behavioral parity tests
        working-directory: src-tauri
        env:
          STUDYHUB_GITHUB_REPO: ${{ github.repository }}
        run: cargo test

      - name: Build Tauri v2 Windows NSIS installer
        env:
          STUDYHUB_GITHUB_REPO: ${{ github.repository }}
        run: npx @tauri-apps/cli@2 build --bundles nsis

      - name: Collect Windows artifacts and generate SHA-256 checksums.txt
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null

          $nsisExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $nsisExe) {
            Write-Error "NSIS setup .exe not found under src-tauri/target/release/bundle/nsis!"
            exit 1
          }
          $setupOut = "release/StudyHub-Setup-$ver.exe"
          Copy-Item -Force $nsisExe.FullName $setupOut

          $rawBin = "src-tauri/target/release/studyhub.exe"
          if (-not (Test-Path $rawBin)) {
            Write-Error "Compiled binary $rawBin not found!"
            exit 1
          }
          $portableOut = "release/StudyHub-Portable-$ver.exe"
          Copy-Item -Force $rawBin $portableOut

          $checksumLines = @()
          foreach ($f in @($setupOut, $portableOut)) {
            $hash = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path -Leaf $f
            $checksumLines += "$hash  $name"
          }
          $checksumLines -join "`n" | Set-Content -Path "release/checksums.txt" -Encoding utf8NoBOM

          Write-Host "=== release/checksums.txt ==="
          Get-Content "release/checksums.txt"
          Get-ChildItem -Path release | Format-Table Name, Length

      - name: Upload Windows .exe workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StudyHub-Windows-x64-Tauri
          path: |
            release/StudyHub-Setup-*.exe
            release/StudyHub-Portable-*.exe
            release/checksums.txt
            AGENT_GUIDE.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Joel Study Hub ${{ steps.tag.outputs.name }} (Windows x64 · Rust/Tauri v2)
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Joel Study Hub Windows 桌面客户端 (${{ steps.tag.outputs.name }})

            基于 **Tauri v2 + Rust 原生内核** 构建（超轻安装包、**零 localhost、零端口、零预设示例**），内置免密钥直连 GitHub Releases + SHA-256 校验的一键升级功能。

            ### 下载说明（点击下方 Assets 中的文件下载）
            - **`StudyHub-Setup-*.exe`**（推荐）：标准 Windows NSIS 安装程序，支持应用内「设置 → 检查更新」直连 GitHub Releases 校验并一键升级。
            - **`StudyHub-Portable-*.exe`**：免安装单文件便携版，下载后双击即可运行。
            - **`checksums.txt`**：SHA-256 完整性校验清单（供应用内升级自动校验使用，请勿删除）。
            - **`AGENT_GUIDE.md`**：AI Agent 本地文件协作协议文档。
          files: |
            release/StudyHub-Setup-*.exe
            release/StudyHub-Portable-*.exe
            release/checksums.txt
            AGENT_GUIDE.md
