name: Release Windows (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-and-release-windows:
    name: Build & Publish Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Electron & electron-builder
        run: npm install -D electron electron-builder

      - name: Build Electron main process
        run: npm run electron:build-main

      - name: Type-check & run tests
        run: |
          npm run lint
          npm test

      - name: Build Windows installer & portable .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run electron:pack

      - name: Upload Windows .exe workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StudyHub-Windows-x64
          path: |
            release/StudyHub-Setup-*.exe
            release/StudyHub-Portable-*.exe
            AGENT_GUIDE.md

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "name=${{ inputs.release_tag }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: StudyHub ${{ steps.tag.outputs.name }} (Windows x64)
          generate_release_notes: true
          body: |
            ## StudyHub Windows 桌面客户端 (${{ steps.tag.outputs.name }})

            纯原生 Electron 客户端（**零 localhost、零端口、零预设示例**），直接交给 AI Agent 读写本地文件夹协作。

            ### 下载说明
            - **`StudyHub-Setup-*.exe`**（推荐）：标准 Windows 安装程序，自动创建桌面快捷方式。
            - **`StudyHub-Portable-*.exe`**：免安装便携版，双击即可直接运行。
            - **`AGENT_GUIDE.md`**：AI Agent 接入协议文档（软件启动后也会自动生成到数据目录内）。
          files: |
            release/StudyHub-Setup-*.exe
            release/StudyHub-Portable-*.exe
            AGENT_GUIDE.md
