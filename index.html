    <meta property="og:title" content="Joel Study Hub" />
    <meta property="og:description" content="本地桌面学习客户端：点词翻译、离线词典、本地单词库、Agent 测验与间隔复习。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: desc.get,
              set: function () {},
              configurable: true,
              enumerable: Boolean(desc.enumerable),
            });
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (evt) {
            var filename = evt && evt.filename ? String(evt.filename) : '';
            var msg = evt && evt.message ? String(evt.message) : '';
            if (
              filename.indexOf('chrome-extension://') === 0 &&
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              evt.preventDefault();
              evt.stopImmediatePropagation();
            }
          },
          true,
        );
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
